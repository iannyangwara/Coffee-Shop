{% extends "cafes/base.html" %}
{% block title %}Sign in · {{ cafe.name }}{% endblock %}
{% block content %}
<div class="wrap section narrow-page">
  <h1 class="page-title">Sign in</h1>
  <form method="post" class="card" novalidate>
    {% csrf_token %}<input type="hidden" name="next" value="{{ next }}">
    {% include "customers/_fields.html" %}
    <button type="submit" class="button wide">Sign in</button>
    <p class="muted small">Forgotten your password? <a href="{% url 'cafes:contact' cafe.slug %}">Send us a message</a> and we'll help.</p>
  </form>
  <p class="center">New here? <a href="{% url 'cafes:sign_up' cafe.slug %}?next={{ next|urlencode }}">Create an account</a></p>
</div>
{% endblock %}
